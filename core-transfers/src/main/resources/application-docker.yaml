server:
  port: 8080
spring:
  application:
    name: mt-core-transfers
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://core-transfers-postgres:5432/mt_core_transfers?minimumIdle=2
    username: mt_core_transfers_admin
    password: mt_core_transfers_admin
    hikari:
      minimumIdle: 2
      maximumPoolSize: 4
  jpa:
    show-sql: true
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info,metric
  endpoint:
    health:
      show-details: always
transfers:
  max-transfer-sum: 1000.00
  demo-transfers-enabled: false
  blocked-account-numbers:
    - "123"
    - "234"
    - "456"
  paging-offset:
    default-value: 20
    maximum-value: 1000
integrations:
  limits:
    url: http://mt-limits:8080/api/v1/limits
    read-timeout: 30s
    write-timeout: 2s