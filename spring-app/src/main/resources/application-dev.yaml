server:
  port: 8189
logging:
  level:
    root: info
    ru.otus: debug
    org.springframework.jdbc.core.JdbcTemplate: TRACE
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./database;MODE=PostgreSQL
    username: sa
    password:
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
  h2:
    console:
      enabled: true

